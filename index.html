
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arryssa's Archive!!</title>

    <style>
        body {
            background-color: #fffdfd;
            color: #77658f;
            font-family: "MV Boli", sans-serif;
            text-align: center;
            padding: 120px 15px 60px;
            margin: 0;
            min-height: 100vh;
            box-sizing: border-box;

            background-image:
                radial-gradient(#f9d5e8 2px, transparent 2px),
                radial-gradient(#d7e9ff 2px, transparent 2px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
        }

        .box {
            border: 3px dashed #dcbbea;
            border-radius: 22px;
            padding: 30px;
            display: inline-block;
            background-color: #fff2b8;
            max-width: 520px;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 5px 5px 0 #f7d7e9;
        }

        h1 {
            color: #cf80b3;
            font-size: 30px;
        }

        p {
            font-size: 16px;
            line-height: 1.9;
        }

        .decorations {
            font-size: 23px;
            margin: 16px;
            color: #a18acb;
        }

        button {
            background-color: #fbe0ee;
            color: #805a91;
            border: 2px solid #e5b8df;
            border-radius: 12px;
            padding: 12px 22px;
            margin: 8px;
            font-family: "MV Boli", sans-serif;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.15s;
        }

        button:nth-of-type(2) {
            background-color: #e3f1ff;
            border-color: #b9d7f5;
        }

        button:hover {
            transform: scale(1.07);
            background-color: #e4f5d9;
            border-color: #b8d9a7;
        }

        .rainbow {
            color: #a18acb;
        }

        .warning {
            position: fixed;
            bottom: 10px;
            right: 12px;
            font-size: 11px;
            font-weight: bold;
            color: #c96f78;
            background-color: rgba(255, 253, 253, 0.92);
            padding: 5px 7px;
            border-radius: 6px;
        }

        .warning a {
            color: #c96f78;
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .warning a:hover {
            color: #a84f60;
        }

        @media (max-width: 480px) {
            body {
                padding-top: 80px;
            }

            h1 {
                font-size: 24px;
            }

            .box {
                padding: 22px 15px;
            }

            .warning {
                font-size: 10px;
            }
        }
    </style>

    <link rel="icon" type="image/png" href="logo.png">
</head>

<body>

    <div class="box">

        <div class="decorations">
            * * * * *
        </div>

        <h1>HIII STRANGER!! :D</h1>

        <p>
            it is so noice to see u on my page ooh!!
            <br>
            i hope u wanna enter!!
        </p>

        <div class="decorations">
            ~ * ~ * ~
        </div>

        <button onclick="location.href='menu.html'">
            YES!!
        </button>

        <button onclick="location.href='menu.html'">
            YAYA!!
        </button>

        <p class="rainbow">
            * click a button!! *
        </p>

    </div>

    <div class="warning">
        <a href="warning.html">TRIGGER WARNINGS</a>
    </div>

</body>

</html>
